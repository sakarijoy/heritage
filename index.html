<header><a class="brand" href="./">◈ 山河足迹</a><span>我的旅行手账</span><details id="app-more"><summary aria-label="更多功能">更多 ···</summary><div class="more-menu"><button id="export" type="button">备份</button><label class="import">恢复<input id="import" type="file" accept="application/json" hidden></label><button id="install-help" type="button">使用说明</button></div></details></header>
<main>
<section id="heritage-page" class="app-page" aria-labelledby="heritage-title">
<div class="page-heading"><span class="eyebrow">WORLD HERITAGE</span><h1 id="heritage-title">遗产探索</h1><p>把想去的地方，慢慢变成去过的地方。</p></div>
<div class="stats" id="stats"></div>
<section class="heritage-browser" aria-label="世界遗产查询"><div id="regions" class="region-picker" role="group" aria-label="遗产地区"></div>
<article><nav id="heritage-modes" aria-label="遗产记录类型"><button class="tab active" data-mode="all">全部遗产</button><button class="tab" data-mode="todo">想去</button><button class="tab" data-mode="done">已打卡</button></nav>
<div id="filters"><input id="search" placeholder="搜索遗产、省份或城市…" aria-label="搜索"><select id="type" aria-label="遗产类型"><option value="">全部类型</option><option>文化遗产</option><option>自然遗产</option><option>双重遗产</option></select><select id="province" aria-label="省份"><option value="">全部省份</option></select></div>
<div id="heritage-location" class="heritage-location" hidden><span id="heritage-location-label"></span><button id="clear-location" type="button">清除城市条件</button></div>
<div class="result-head"><span id="count"></span><span>名录项目与子地点分别记录</span></div>
<div id="result-start" class="result-toolbar" tabindex="-1"><span id="page-range" role="status" aria-live="polite"></span><label for="page-size">每页 <select id="page-size" aria-label="每页遗产数量"><option value="8">8 个</option><option value="16">16 个</option><option value="32">32 个</option></select></label></div><div id="results"></div><div id="pagination" class="result-pagination" role="navigation" aria-label="遗产列表分页" hidden></div>
</article></section></section>
<section id="visits-page" class="app-page" aria-labelledby="visits-title" hidden>
<div class="page-heading"><span class="eyebrow">MY FOOTPRINTS</span><h1 id="visits-title">省市足迹</h1><p>每一次抵达，都值得记下来。</p></div>
<div id="visit-summary" class="visit-summary" role="status" aria-live="polite" aria-atomic="true"></div>
<section class="visit-browser" aria-label="省市到访记录">
<h2 class="section-label">按地区查看</h2><div id="visit-regions" class="region-picker" role="group" aria-label="到访记录地区"></div>
<div class="visit-filter-row"><label for="visit-status">到访状态</label><select id="visit-status"><option value="all">全部记录</option><option value="visited">已到访</option><option value="unvisited">未到访</option></select></div>
<p class="visit-instruction">勾选记录到访，点击名称填写日期和备注。省份与下级分别记录。</p>
<div id="provinces"></div>
</section></section>
<footer>资料来源：<a href="https://whc.unesco.org/en/statesparties/cn" target="_blank" rel="noopener">UNESCO 世界遗产中心 ↗</a> · 记录仅存本机，请定期备份。</footer>
</main>

<div id="toast" role="status"></div>
<dialog id="visit-dialog" aria-labelledby="visit-editor-title"><div class="visit-editor-top"><span>省市到访记录</span><button id="visit-editor-close" type="button" aria-label="关闭到访记录">✕</button></div><form id="visit-editor-form"><h2 id="visit-editor-title"></h2><p id="visit-editor-status"></p><label for="visit-date">到访日期 <span>选填，可记录最近一次到访</span></label><input id="visit-date" type="date"><label for="visit-note">简短备注 <span>选填，最多500字</span></label><textarea id="visit-note" maxlength="500" rows="5" placeholder="例如：国庆自驾，沿江散步的一天。"></textarea><p class="visit-editor-help">保存日期和备注不会改变到访勾选状态。取消勾选也会保留这些内容。</p><div class="visit-editor-actions"><button id="visit-editor-heritage" type="button">查看当地遗产 ↗</button><button class="primary" type="submit">保存记录</button></div></form></dialog>
