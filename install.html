<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>山河足迹 · 手机安装说明</title><link rel="stylesheet" href="install.css"></head><body><main><a href="./" class="back">← 打开应用</a><img class="icon" src="icons-apple-touch-icon.png" alt="山河足迹" width="84" height="84"><h1>添加到 iPhone 主屏幕</h1><p>先用 Safari 打开本应用，确认页面能正常加载。</p><section><ol><li>点击 Safari 的“分享”按钮。</li><li>选择“添加到主屏幕”，如有“作为网页 App 打开”，保持开启。</li><li>从主屏幕进入，等待“离线资源已就绪”。</li></ol></section><p>无需安装描述文件。旧安装描述文件指向原托管地址，请勿继续使用。</p><p>记录只保存在当前设备和当前网站地址对应的存储中。迁移到新网址不会自动带入旧记录，请从旧入口导出备份，再在新入口恢复。</p><a class="primary" href="./">进入山河足迹</a></main></body></html>
